name: Bug report
description: Something in the editor, the engine or an exported game does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. Attach a project or scene if it helps.
      placeholder: |
        1. Open the Lantern Grove sample.
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The log of the editor or game, if it shows an error.
      render: text
