# Runs the tests marked Category=Slow, which publish players, export games and build plugins: on each push to main, nightly, on demand, and on
# pull requests that are labelled run-slow or change the build, the player, the asset pipeline or plugins.
name: Slow tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Nightly, so new advisories for NuGet packages, SDK updates and runner image changes show up even on quiet days.
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  decide:
    name: Decide
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-slow')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Check the label and the changed files
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'run-slow') }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ "$LABELLED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename')
          if grep -qE '^(src/Talesmith\.(Build|Player|Assets|Plugins)/|src/Talesmith\.Editor/Plugins/|samples/(LanternGrove|Talesmith\.Samples\.LanternGrove)/|tests/Talesmith\.(Build|EndToEnd)\.Tests/|tests/Talesmith\.Editor\.Tests/Plugins/|Directory\.(Build|Packages)\.props$|global\.json$|\.github/workflows/slow-tests\.yml$)' <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: not labelled run-slow, and no changes to the build, the player, the asset pipeline or plugins." >> "$GITHUB_STEP_SUMMARY"
          fi

  slow-tests:
    name: Slow tests
    needs: decide
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.decide.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: slow-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the NuGet cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Hard links instead of copies keep the build output small: each test project would otherwise carry its own ~550 MB of native
      # libraries for every platform, about 12 GB in all, more than a hosted runner has free.
      - name: Build
        run: >-
          dotnet build Talesmith.slnx
          -p:CreateHardLinksForCopyLocalIfPossible=true
          -p:CreateHardLinksForCopyFilesToOutputDirectoryIfPossible=true
          -p:CreateHardLinksForCopyAdditionalFilesIfPossible=true

      # Projects without slow tests run none, which the test platform reports with exit code 8.
      - name: Test
        run: >-
          dotnet test --solution Talesmith.slnx --no-build --results-directory TestResults --
          --filter-trait "Category=Slow" --ignore-exit-code 8 --report-xunit-trx --hangdump --hangdump-timeout 15m --hangdump-type Mini

      - name: Summarize the tests
        if: ${{ !cancelled() }}
        run: dotnet run .github/scripts/TestSummary.cs -- TestResults

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-results
          path: TestResults
          retention-days: 14
          if-no-files-found: ignore
