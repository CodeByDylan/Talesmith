# Fails a pull request that adds or updates a package with a known vulnerability.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Review the changed dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
