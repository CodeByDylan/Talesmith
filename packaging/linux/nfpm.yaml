# The Debian package, built by nFPM in the repository root from the editor published to artifacts/editor, with TALESMITH_VERSION set.
# apt installs the libraries the editor loads from Depends, and the optional ones from Recommends.
name: talesmith
arch: amd64
platform: linux
version: ${TALESMITH_VERSION}
section: devel
priority: optional
maintainer: Dylan de Beer <59077048+DutchyD@users.noreply.github.com>
vendor: Dylan de Beer
homepage: https://talesmith.dev
license: Apache-2.0
description: |-
  2D game engine and editor for .NET
  Build scenes from tile maps, sprites, lights, particles and prefabs, write gameplay in C#, play the game inside the editor and export
  it for Windows or Linux.
depends:
  - libc6
  - libgcc-s1
  - libstdc++6
  - libfontconfig1
  - libx11-6
  - libxext6
  - libxi6
  - libxrandr2
  - libxcursor1
  - libxfixes3
  - libice6
  - libsm6
recommends:
  - libvulkan1
  - libgl1
  - libpulse0
  - libgtk-3-0t64 | libgtk-3-0
contents:
  - src: artifacts/editor
    dst: /usr/lib/talesmith
    type: tree
  - src: packaging/linux/talesmith
    dst: /usr/bin/talesmith
    file_info:
      mode: 0755
  - src: packaging/linux/talesmith.desktop
    dst: /usr/share/applications/talesmith.desktop
  - src: website/static/img/logo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/talesmith.svg
  - src: LICENSE
    dst: /usr/share/doc/talesmith/copyright
